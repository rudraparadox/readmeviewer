<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Viewer</title>
  <!-- Markdown parser from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    select, button {
      font-size: 1rem;
      padding: 0.4em 1em;
      margin-right: 1em;
    }
    #content {
      margin-top: 2rem;
      border: 1px solid #ddd;
      padding: 1.5rem;
      border-radius: 8px;
      background: #fafafa;
    }
    /* Basic styling for rendered Markdown */
    #content h1, #content h2, #content h3 { margin-top: 1.5em; }
    #content pre { background: #eee; padding: 1em; border-radius: 4px; overflow-x: auto; }
    #content code { background: #eee; padding: 0.2em 0.4em; border-radius: 3px; }
    #content img { max-width: 100%; }
  </style>
</head>
<body>
  <h1>📄 README Selector</h1>
  <label for="fileSelect">Choose documentation:</label>
  <select id="fileSelect">
    <option value="Documentation/readme.md">Full Documentation</option>
    <option value="Documentation-Short/readme.md">Short Documentation</option>
  </select>
  <button id="loadBtn">Load</button>

  <div id="content">
    <p><em>Select a file and click "Load" to see the content.</em></p>
  </div>

  <script>
    const select = document.getElementById('fileSelect');
    const loadBtn = document.getElementById('loadBtn');
    const contentDiv = document.getElementById('content');

    async function loadReadme(path) {
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        // Convert Markdown to HTML using marked
        contentDiv.innerHTML = marked.parse(markdown);
      } catch (error) {
        contentDiv.innerHTML = `<p style="color:red;">❌ Error loading <code>${path}</code>: ${error.message}</p>`;
      }
    }

    // Load on button click
    loadBtn.addEventListener('click', () => {
      loadReadme(select.value);
    });

    // Optional: auto-load the first one on page load
    // loadReadme(select.value);
  </script>
</body>
</html>
