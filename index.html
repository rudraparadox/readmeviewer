<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Viewer – Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    .content-scroll::-webkit-scrollbar { width: 5px; }
    .content-scroll::-webkit-scrollbar-track { background: transparent; }
    .content-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 3px; }
    .mobile-menu {
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .mobile-menu.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    .fullscreen .main-content { border-radius: 0 !important; }
    .fullscreen .content-scroll { max-height: 100vh !important; }

    /* Spotlight – dims everything except the highlighted element */
    .tour-highlight {
      position: relative;
      z-index: 70 !important;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65);
      border-radius: 0.75rem;
      transition: box-shadow 0.3s;
    }

    /* Tooltip */
    .tour-tooltip {
      position: fixed;
      z-index: 80;
      background: rgba(30,41,59,0.98);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 1.25rem;
      max-width: 18rem;
      width: calc(100% - 2rem);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      font-size: 0.875rem;
      color: #e2e8f0;
      pointer-events: auto;
    }
    .tour-tooltip::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(30,41,59,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .tooltip-arrow-bottom::before { top: -6px; left: 20px; border-bottom: none; border-right: none; }
    .tooltip-arrow-top::before { bottom: -6px; left: 20px; border-top: none; border-left: none; }
    .tooltip-arrow-left::before { right: -6px; top: 20px; border-left: none; border-top: none; }
    .tooltip-arrow-right::before { left: -6px; top: 20px; border-right: none; border-bottom: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Mobile header -->
  <header class="lg:hidden flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <button id="menuToggle" class="p-2 rounded-lg hover:bg-slate-800 transition text-slate-400 hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <!-- Dynamic header: shows current document name -->
    <h1 id="mobileFileLabel" class="text-lg font-semibold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent truncate max-w-[200px]">
      📄 Full Documentation
    </h1>
    <button id="helpBtn" class="p-2 rounded-lg hover:bg-slate-800 transition text-slate-400 hover:text-white" title="Help">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar -->
    <aside id="sidebar" class="
      lg:relative lg:translate-x-0 lg:opacity-100 lg:pointer-events-auto
      fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800
      flex flex-col transition-all duration-300
      mobile-menu
    ">
      <div class="hidden lg:block p-6 border-b border-slate-800">
        <div class="flex items-center gap-3 mb-4">
          <span class="text-2xl">📄</span>
          <h1 id="desktopFileLabel" class="text-xl font-semibold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
            Full Documentation
          </h1>
        </div>
        <p class="text-xs text-slate-500 uppercase tracking-widest font-medium">Select a variant</p>
      </div>
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="fileList">
        <button class="file-item active w-full text-left px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 flex items-center gap-3 text-sm"
                data-file="Documentation/readme.md">
          <span class="text-lg">📘</span> Full Documentation
        </button>
        <button class="file-item w-full text-left px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 flex items-center gap-3 text-sm"
                data-file="Documentation-Short/readme.md">
          <span class="text-lg">📙</span> Short Documentation
        </button>
        <!-- NEW: Developer section -->
        <button class="file-item w-full text-left px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 flex items-center gap-3 text-sm"
                data-file="Developer/developer.md">
          <span class="text-lg">🛠️</span> Developer Notes
        </button>
      </nav>
      <div class="p-4 border-t border-slate-800 text-xs text-slate-600 text-center hidden lg:block">
        Enterprise Edition v1.0
      </div>
    </aside>

    <div id="menuOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <!-- Main content -->
    <main class="main-content flex-1 flex flex-col bg-slate-900/50 backdrop-blur-sm border border-slate-800 border-b-0 border-r-0 overflow-hidden">
      <header class="hidden lg:flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
          <span id="currentFileLabel" class="text-sm text-slate-400">Full Documentation</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="fsToggleBtn" class="p-2 rounded-lg hover:bg-slate-800 transition text-slate-400 hover:text-white" title="Toggle fullscreen">
            <svg id="fsIconEnter" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <svg id="fsIconExit" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
              <polyline points="4 8 4 4 8 4"></polyline>
              <polyline points="16 4 20 4 20 8"></polyline>
              <polyline points="20 16 20 20 16 20"></polyline>
              <polyline points="8 20 4 20 4 16"></polyline>
            </svg>
          </button>
          <button id="helpBtnDesktop" class="p-2 rounded-lg hover:bg-slate-800 transition text-slate-400 hover:text-white" title="Help">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>
        </div>
      </header>

      <div id="contentArea" class="content-scroll flex-1 overflow-y-auto p-4 md:p-8 lg:p-10">
        <div id="placeholder" class="flex flex-col items-center justify-center h-full text-slate-600">
          <span class="text-5xl mb-4">📂</span>
          <p class="text-lg">Select a file from the menu to view documentation</p>
        </div>
        <div id="markdownContent" class="hidden max-w-4xl mx-auto"></div>
      </div>
    </main>
  </div>

  <!-- Tour tooltip (fixed) -->
  <div id="tourTooltip" class="tour-tooltip hidden tooltip-arrow-bottom">
    <p id="tourText" class="mb-4 text-slate-200 text-sm"></p>
    <div class="flex justify-between items-center">
      <button id="tourSkip" class="text-xs text-slate-500 hover:text-white transition">Skip</button>
      <button id="tourNext" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Next</button>
    </div>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('menuOverlay');
    const fileItems = document.querySelectorAll('.file-item');
    const markdownContent = document.getElementById('markdownContent');
    const placeholder = document.getElementById('placeholder');
    const currentFileLabel = document.getElementById('currentFileLabel');
    const mobileFileLabel = document.getElementById('mobileFileLabel');
    const desktopFileLabel = document.getElementById('desktopFileLabel');
    const contentArea = document.getElementById('contentArea');
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    const fsIconEnter = document.getElementById('fsIconEnter');
    const fsIconExit = document.getElementById('fsIconExit');
    const helpBtn = document.getElementById('helpBtn');
    const helpBtnDesktop = document.getElementById('helpBtnDesktop');
    const fileList = document.getElementById('fileList');
    const tourTooltip = document.getElementById('tourTooltip');
    const tourText = document.getElementById('tourText');
    const tourNext = document.getElementById('tourNext');
    const tourSkip = document.getElementById('tourSkip');

    let currentFile = 'Documentation/readme.md';
    let currentFileName = '📄 Full Documentation'; // for header updates
    let isFullscreen = false;
    let currentStep = -1;
    let highlightedElement = null;

    function closeMenu() {
      sidebar.classList.remove('open');
      overlay.classList.add('hidden');
    }
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('hidden');
    });
    overlay.addEventListener('click', closeMenu);

    // Update all header labels when a file is selected
    function updateHeaderLabels(label) {
      if (currentFileLabel) currentFileLabel.textContent = label;
      if (mobileFileLabel) mobileFileLabel.textContent = label;
      if (desktopFileLabel) desktopFileLabel.textContent = label;
    }

    fileItems.forEach(item => {
      item.addEventListener('click', () => {
        if (window.innerWidth < 1024) closeMenu();
        fileItems.forEach(b => b.classList.remove('active'));
        item.classList.add('active');
        currentFile = item.dataset.file;
        const label = item.innerText.trim();
        updateHeaderLabels(label);
        loadMarkdown(currentFile);
      });
    });

    fsToggleBtn.addEventListener('click', () => {
      isFullscreen = !isFullscreen;
      document.body.classList.toggle('fullscreen', isFullscreen);
      if (isFullscreen) {
        fsIconEnter.classList.add('hidden');
        fsIconExit.classList.remove('hidden');
        document.querySelector('header.lg\\:hidden').style.display = 'none';
      } else {
        fsIconEnter.classList.remove('hidden');
        fsIconExit.classList.add('hidden');
        document.querySelector('header.lg\\:hidden').style.display = '';
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFullscreen) fsToggleBtn.click();
    });

    async function loadMarkdown(path) {
      markdownContent.innerHTML = `
        <div class="flex items-center justify-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
          <span class="ml-3 text-slate-400">Loading documentation...</span>
        </div>`;
      markdownContent.classList.remove('hidden');
      placeholder.classList.add('hidden');
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const md = await response.text();
        const html = marked.parse(md);
        markdownContent.innerHTML = `<div class="prose prose-invert max-w-none">${html}</div>`;
        applyPremiumStyling();
        contentArea.scrollTop = 0;
      } catch (error) {
        markdownContent.innerHTML = `
          <div class="bg-red-900/20 border border-red-800/30 rounded-xl p-5 text-red-300 flex gap-3">
            <span>⚠️</span> Could not load <code class="bg-red-900/40 px-1.5 py-0.5 rounded">${path}</code>: ${error.message}
          </div>`;
      }
    }

    function applyPremiumStyling() {
      const container = markdownContent.querySelector('.prose');
      if (!container) return;
      container.querySelectorAll('h1').forEach(h => h.className = 'text-2xl sm:text-3xl font-bold text-slate-100 mt-10 mb-5 tracking-tight border-b border-slate-800 pb-3');
      container.querySelectorAll('h2').forEach(h => h.className = 'text-xl sm:text-2xl font-semibold text-slate-200 mt-8 mb-4');
      container.querySelectorAll('h3').forEach(h => h.className = 'text-lg sm:text-xl font-medium text-slate-300 mt-6 mb-3');
      container.querySelectorAll('p').forEach(p => p.className = 'leading-relaxed text-slate-400 mb-4 text-sm sm:text-base');
      container.querySelectorAll('ul, ol').forEach(l => l.className = 'pl-5 sm:pl-6 mb-4 space-y-2 text-slate-400 text-sm sm:text-base');
      container.querySelectorAll('li').forEach(li => li.className = 'leading-relaxed');
      container.querySelectorAll('pre').forEach(pre => pre.className = 'bg-slate-950 border border-slate-800 rounded-xl p-4 sm:p-5 overflow-x-auto my-5 text-xs sm:text-sm');
      container.querySelectorAll('pre code').forEach(code => code.className = 'text-indigo-300 font-mono');
      container.querySelectorAll('code:not(pre code)').forEach(code => code.className = 'bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded-md font-mono text-xs sm:text-sm');
      container.querySelectorAll('a').forEach(a => a.className = 'text-indigo-400 hover:text-indigo-300 underline decoration-indigo-400/30 underline-offset-2 transition');
      container.querySelectorAll('blockquote').forEach(bq => bq.className = 'border-l-4 border-indigo-500/50 pl-4 sm:pl-5 italic text-slate-500 my-5');
      container.querySelectorAll('img').forEach(img => img.className = 'max-w-full rounded-xl my-4');
      container.querySelectorAll('table').forEach(table => {
        table.className = 'w-full border-collapse my-5 text-xs sm:text-sm';
        table.querySelectorAll('th').forEach(th => th.className = 'border border-slate-700 px-3 py-2 bg-slate-800 text-left font-semibold');
        table.querySelectorAll('td').forEach(td => td.className = 'border border-slate-700 px-3 py-2');
      });
      container.querySelectorAll('hr').forEach(hr => hr.className = 'border-slate-800 my-6');
    }

    // ─── TOUR (unchanged) ────────────────────────────
    const steps = [
      {
        text: "Select a documentation file here. Tap any item to load it instantly.",
        getElement: () => window.innerWidth >= 1024 ? fileList : menuToggle,
      },
      {
        text: "Click this button to enter full‑screen reading mode. Press <b>Esc</b> to exit.",
        getElement: () => fsToggleBtn,
      },
      {
        text: "Here's your loaded documentation. <b>Scroll</b> to read the entire file.",
        getElement: () => contentArea,
      },
    ];

    function removeArrowClasses() {
      tourTooltip.classList.remove('tooltip-arrow-bottom', 'tooltip-arrow-top', 'tooltip-arrow-left', 'tooltip-arrow-right');
    }

    function positionTooltip(targetEl) {
      const rect = targetEl.getBoundingClientRect();
      const tooltipWidth = tourTooltip.offsetWidth;
      const tooltipHeight = tourTooltip.offsetHeight;
      const margin = 16;
      let top, left;
      removeArrowClasses();

      const spaceBottom = window.innerHeight - rect.bottom - margin;
      const spaceTop = rect.top - margin;
      const spaceRight = window.innerWidth - rect.right - margin;
      const spaceLeft = rect.left - margin;

      if (spaceBottom >= tooltipHeight + margin) {
        top = rect.bottom + margin;
        left = rect.left + rect.width/2 - tooltipWidth/2;
        tourTooltip.classList.add('tooltip-arrow-bottom');
      } else if (spaceTop >= tooltipHeight + margin) {
        top = rect.top - tooltipHeight - margin;
        left = rect.left + rect.width/2 - tooltipWidth/2;
        tourTooltip.classList.add('tooltip-arrow-top');
      } else if (spaceRight >= tooltipWidth + margin) {
        top = rect.top + rect.height/2 - tooltipHeight/2;
        left = rect.right + margin;
        tourTooltip.classList.add('tooltip-arrow-left');
      } else if (spaceLeft >= tooltipWidth + margin) {
        top = rect.top + rect.height/2 - tooltipHeight/2;
        left = rect.left - tooltipWidth - margin;
        tourTooltip.classList.add('tooltip-arrow-right');
      } else {
        top = Math.max(margin, (window.innerHeight - tooltipHeight) / 2);
        left = Math.max(margin, (window.innerWidth - tooltipWidth) / 2);
      }

      left = Math.min(Math.max(left, margin), window.innerWidth - tooltipWidth - margin);
      top = Math.min(Math.max(top, margin), window.innerHeight - tooltipHeight - margin);

      tourTooltip.style.top = top + 'px';
      tourTooltip.style.left = left + 'px';
    }

    function showStep(stepIndex) {
      if (stepIndex >= steps.length) { endTour(); return; }
      currentStep = stepIndex;
      const step = steps[stepIndex];
      const element = step.getElement();
      if (!element) return;

      if (highlightedElement) highlightedElement.classList.remove('tour-highlight');
      element.classList.add('tour-highlight');
      highlightedElement = element;

      tourText.innerHTML = step.text;
      tourNext.textContent = stepIndex === steps.length - 1 ? 'Finish' : 'Next';

      tourTooltip.classList.remove('hidden');
      requestAnimationFrame(() => {
        positionTooltip(element);
      });
    }

    function endTour() {
      tourTooltip.classList.add('hidden');
      if (highlightedElement) {
        highlightedElement.classList.remove('tour-highlight');
        highlightedElement = null;
      }
      currentStep = -1;
      localStorage.setItem('tourSeen', 'true');
    }

    tourNext.addEventListener('click', () => showStep(currentStep + 1));
    tourSkip.addEventListener('click', endTour);

    window.addEventListener('resize', () => {
      if (currentStep !== -1 && highlightedElement) positionTooltip(highlightedElement);
    });
    window.addEventListener('scroll', () => {
      if (currentStep !== -1 && highlightedElement) positionTooltip(highlightedElement);
    }, true);

    function startTour() {
      currentStep = -1;
      showStep(0);
    }
    helpBtn.addEventListener('click', startTour);
    helpBtnDesktop.addEventListener('click', startTour);

    if (!localStorage.getItem('tourSeen')) {
      setTimeout(startTour, 800);
    }

    // Load default file and set initial header
    updateHeaderLabels('📄 Full Documentation');
    loadMarkdown(currentFile);
  </script>
</body>
</html>
