<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Hub – Enterprise Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Smooth animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    /* Custom scrollbar for the content panel */
    .content-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .content-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .content-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }
    .content-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    /* Sidebar active state */
    .file-item.active {
      background: rgba(99, 102, 241, 0.15);
      border-left: 3px solid #6366f1;
      color: #e2e8f0;
    }

    /* Fullscreen styles */
    .fullscreen #sidebar {
      display: none;
    }
    .fullscreen .main-panel {
      border-radius: 0 !important;
    }
    .fullscreen .content-scroll {
      max-height: 100vh !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300">
    <!-- Sidebar header -->
    <div class="p-6 border-b border-slate-800">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-2xl">📄</span>
        <h1 class="text-xl font-semibold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
          Documentation Hub
        </h1>
      </div>
      <p class="text-xs text-slate-500 uppercase tracking-widest font-medium">Select a variant</p>
    </div>
    <!-- File list -->
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <button class="file-item active w-full text-left px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 flex items-center gap-3 text-sm"
              data-file="Documentation/readme.md">
        <span class="text-lg">📘</span> Full Documentation
      </button>
      <button class="file-item w-full text-left px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 flex items-center gap-3 text-sm"
              data-file="Documentation-Short/readme.md">
        <span class="text-lg">📙</span> Short Documentation
      </button>
    </nav>
    <!-- Sidebar footer (optional branding) -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-600 text-center">
      Enterprise Edition v1.0
    </div>
  </aside>

  <!-- Main panel -->
  <div class="main-panel flex-1 flex flex-col bg-slate-900/50 backdrop-blur-sm rounded-tl-3xl border border-slate-800 border-b-0 border-r-0 overflow-hidden">
    <!-- Top bar -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <span id="currentFileLabel" class="text-sm text-slate-400">Full Documentation</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="fsToggleBtn" class="p-2 rounded-lg hover:bg-slate-800 transition text-slate-400 hover:text-white" title="Toggle fullscreen">
          <svg id="fsIconEnter" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg id="fsIconExit" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <polyline points="4 8 4 4 8 4"></polyline>
            <polyline points="16 4 20 4 20 8"></polyline>
            <polyline points="20 16 20 20 16 20"></polyline>
            <polyline points="8 20 4 20 4 16"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content area -->
    <main id="contentArea" class="content-scroll flex-1 p-6 md:p-10 overflow-y-auto animate-fade-in">
      <!-- Loading / placeholder -->
      <div id="placeholder" class="flex flex-col items-center justify-center h-full text-slate-600">
        <span class="text-5xl mb-4">📂</span>
        <p class="text-lg">Select a file from the sidebar to view documentation</p>
      </div>
      <div id="markdownContent" class="hidden max-w-4xl mx-auto"></div>
    </main>
  </div>

  <script>
    const fileItems = document.querySelectorAll('.file-item');
    const contentArea = document.getElementById('contentArea');
    const markdownContent = document.getElementById('markdownContent');
    const placeholder = document.getElementById('placeholder');
    const currentFileLabel = document.getElementById('currentFileLabel');
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    const fsIconEnter = document.getElementById('fsIconEnter');
    const fsIconExit = document.getElementById('fsIconExit');
    let isFullscreen = false;

    // Active file state
    let currentFile = 'Documentation/readme.md';

    // Handle sidebar clicks
    fileItems.forEach(btn => {
      btn.addEventListener('click', () => {
        // Update active state
        fileItems.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFile = btn.dataset.file;
        currentFileLabel.textContent = btn.innerText.trim();
        loadMarkdown(currentFile);
      });
    });

    // Fullscreen toggle
    fsToggleBtn.addEventListener('click', () => {
      isFullscreen = !isFullscreen;
      document.body.classList.toggle('fullscreen', isFullscreen);
      if (isFullscreen) {
        fsIconEnter.classList.add('hidden');
        fsIconExit.classList.remove('hidden');
      } else {
        fsIconEnter.classList.remove('hidden');
        fsIconExit.classList.add('hidden');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFullscreen) {
        fsToggleBtn.click();
      }
    });

    async function loadMarkdown(path) {
      // Show loading state
      markdownContent.innerHTML = `
        <div class="flex items-center justify-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
          <span class="ml-3 text-slate-400">Loading documentation...</span>
        </div>`;
      markdownContent.classList.remove('hidden');
      placeholder.classList.add('hidden');

      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const md = await response.text();
        const html = marked.parse(md);
        // Wrap in a styled container
        markdownContent.innerHTML = `<div class="prose prose-invert max-w-none">${html}</div>`;
        // Enhance styling for enterprise look
        styleMarkdownElements();
        // Scroll to top
        contentArea.scrollTop = 0;
      } catch (error) {
        markdownContent.innerHTML = `
          <div class="bg-red-900/20 border border-red-800/30 rounded-xl p-5 text-red-300 flex gap-3">
            <span>⚠️</span> Could not load file <code class="bg-red-900/40 px-1.5 py-0.5 rounded">${path}</code>: ${error.message}
          </div>`;
      }
    }

    function styleMarkdownElements() {
      const container = markdownContent.querySelector('.prose');
      if (!container) return;

      // Apply custom classes to markdown elements for enterprise feel
      container.querySelectorAll('h1').forEach(h => {
        h.className = 'text-3xl font-bold text-slate-100 mt-12 mb-6 tracking-tight border-b border-slate-800 pb-4';
      });
      container.querySelectorAll('h2').forEach(h => {
        h.className = 'text-2xl font-semibold text-slate-200 mt-10 mb-4';
      });
      container.querySelectorAll('h3').forEach(h => {
        h.className = 'text-xl font-medium text-slate-300 mt-8 mb-3';
      });
      container.querySelectorAll('p').forEach(p => {
        p.className = 'leading-relaxed text-slate-400 mb-5';
      });
      container.querySelectorAll('ul, ol').forEach(list => {
        list.className = 'pl-6 mb-5 space-y-2 text-slate-400';
      });
      container.querySelectorAll('li').forEach(li => {
        li.className = 'leading-relaxed';
      });
      container.querySelectorAll('pre').forEach(pre => {
        pre.className = 'bg-slate-950 border border-slate-800 rounded-xl p-5 overflow-x-auto my-6 text-sm';
        const code = pre.querySelector('code');
        if (code) code.className = 'text-indigo-300 font-mono';
      });
      container.querySelectorAll('code:not(pre code)').forEach(code => {
        code.className = 'bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded-md font-mono text-sm';
      });
      container.querySelectorAll('a').forEach(a => {
        a.className = 'text-indigo-400 hover:text-indigo-300 underline decoration-indigo-400/30 underline-offset-2 transition';
      });
      container.querySelectorAll('blockquote').forEach(bq => {
        bq.className = 'border-l-4 border-indigo-500/50 pl-5 italic text-slate-500 my-6';
      });
      container.querySelectorAll('img').forEach(img => {
        img.className = 'max-w-full rounded-xl my-6';
      });
      container.querySelectorAll('table').forEach(table => {
        table.className = 'w-full border-collapse my-6 text-sm';
        table.querySelectorAll('th').forEach(th => th.className = 'border border-slate-700 px-4 py-2 bg-slate-800 text-left font-semibold');
        table.querySelectorAll('td').forEach(td => td.className = 'border border-slate-700 px-4 py-2');
      });
      container.querySelectorAll('hr').forEach(hr => {
        hr.className = 'border-slate-800 my-8';
      });
    }

    // Auto-load the first file on page load
    loadMarkdown(currentFile);
  </script>
</body>
</html>
