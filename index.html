<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ---- Custom animations ---- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .shimmer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: shimmer 1.8s infinite;
    }

    /* ---- Scrollable content area + custom scrollbar ---- */
    .markdown-content {
      max-height: 65vh;                /* scroll inside the card, not the page */
      overflow-y: auto;
      padding-right: 8px;              /* space for the scrollbar */
    }

    .markdown-content::-webkit-scrollbar {
      width: 6px;
    }
    .markdown-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .markdown-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
    }
    .markdown-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.2);
    }

    /* ---- Dropdown transition ---- */
    .dropdown-enter {
      opacity: 0;
      transform: translateY(-8px);
    }
    .dropdown-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: all 0.2s ease-out;
    }
  </style>
</head>
<body class="bg-[#0b0f17] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Ambient background -->
  <div class="fixed inset-0 -z-10">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-indigo-900/20 via-transparent to-purple-900/20 animate-pulse"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse animation-delay-2000"></div>
  </div>

  <div class="w-full max-w-4xl animate-fade-in-up">
    <!-- Main glass card -->
    <div class="bg-[#131a28]/80 backdrop-blur-2xl border border-white/5 rounded-3xl shadow-2xl shadow-black/50 p-8 md:p-10 transition-all duration-300 hover:border-white/10 hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.6)]">
      <!-- Header -->
      <div class="flex items-center gap-3 mb-1">
        <span class="text-4xl bg-gradient-to-br from-indigo-400 to-purple-400 bg-clip-text text-transparent">📄</span>
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-slate-100 to-slate-300 bg-clip-text text-transparent tracking-tight">README Viewer</h1>
      </div>
      <p class="text-slate-400 text-lg mb-10 font-light">Select a documentation variant to preview its contents</p>

      <!-- Selector + button -->
      <div class="flex flex-col md:flex-row gap-4 mb-10">
        <!-- Custom dropdown -->
        <div class="relative flex-1" id="dropdownWrapper">
          <button id="dropdownBtn" class="w-full flex items-center justify-between px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-slate-200 hover:bg-white/10 hover:border-white/20 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all duration-200 group">
            <span id="selectedText" class="font-medium">📘 Full Documentation</span>
            <svg class="w-5 h-5 text-indigo-400 transition-transform duration-200 group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div id="dropdownMenu" class="absolute left-0 right-0 mt-2 bg-[#1a2235]/95 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-10 hidden dropdown-enter">
            <div data-value="Documentation/readme.md" class="px-5 py-3.5 hover:bg-white/5 cursor-pointer flex items-center gap-3 text-slate-300 transition-colors hover:text-white dropdown-option">
              <span>📘</span> Full Documentation
            </div>
            <div data-value="Documentation-Short/readme.md" class="px-5 py-3.5 hover:bg-white/5 cursor-pointer flex items-center gap-3 text-slate-300 transition-colors hover:text-white dropdown-option">
              <span>📙</span> Short Documentation
            </div>
          </div>
        </div>
        <button id="loadBtn" class="group relative px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl transition-all duration-300 hover:shadow-[0_12px_30px_-8px_rgba(99,102,241,0.5)] active:scale-95 overflow-hidden">
          <span class="relative z-10 flex items-center gap-2">
            <span class="text-xl">✨</span> Load
          </span>
          <div class="absolute inset-0 bg-gradient-to-r from-indigo-400 to-purple-400 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
        </button>
      </div>

      <!-- Content area with scrolling + markdown styling -->
      <div id="content" class="bg-black/30 border border-white/5 rounded-2xl p-8 transition-opacity duration-200 relative overflow-hidden">
        <p class="text-slate-500 italic text-center mt-12">Select a file and click <strong class="text-slate-400">Load</strong> to render it here.</p>
      </div>
    </div>
  </div>

  <script>
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const selectedText = document.getElementById('selectedText');
    const loadBtn = document.getElementById('loadBtn');
    const contentDiv = document.getElementById('content');
    let selectedValue = 'Documentation/readme.md';

    // Dropdown logic
    dropdownBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
      dropdownMenu.classList.toggle('dropdown-enter-active');
    });
    document.addEventListener('click', (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
        dropdownMenu.classList.remove('dropdown-enter-active');
      }
    });
    document.querySelectorAll('.dropdown-option').forEach(option => {
      option.addEventListener('click', () => {
        selectedValue = option.getAttribute('data-value');
        selectedText.innerHTML = option.innerText.trim();
        dropdownMenu.classList.add('hidden');
        dropdownMenu.classList.remove('dropdown-enter-active');
      });
    });

    // Load markdown with improved styling
    async function loadReadme(path) {
      contentDiv.classList.add('shimmer', 'relative');
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        setTimeout(() => {
          contentDiv.classList.remove('shimmer');
          contentDiv.innerHTML = marked.parse(markdown);

          // Add scrollable wrapper + markdown semantic classes
          const wrapper = document.createElement('div');
          wrapper.className = 'markdown-content text-slate-200 space-y-4';
          // Move parsed content into wrapper
          while (contentDiv.firstChild) {
            wrapper.appendChild(contentDiv.firstChild);
          }
          contentDiv.appendChild(wrapper);

          // ---- Style markdown elements to look like QuickLook / polished docs ----
          // Headings
          wrapper.querySelectorAll('h1').forEach(h => {
            h.className = 'text-3xl font-bold text-slate-100 mt-10 mb-4 tracking-tight';
          });
          wrapper.querySelectorAll('h2').forEach(h => {
            h.className = 'text-2xl font-semibold text-slate-100 mt-8 mb-3 pb-2 border-b border-white/10';
          });
          wrapper.querySelectorAll('h3').forEach(h => {
            h.className = 'text-xl font-semibold text-slate-200 mt-6 mb-2';
          });
          // Paragraphs
          wrapper.querySelectorAll('p').forEach(p => {
            p.className = 'leading-relaxed text-slate-300 mb-4';
          });
          // Lists
          wrapper.querySelectorAll('ul, ol').forEach(list => {
            list.className = 'pl-6 mb-4 space-y-2 text-slate-300';
          });
          wrapper.querySelectorAll('li').forEach(li => {
            li.className = 'leading-relaxed';
          });
          // Code blocks
          wrapper.querySelectorAll('pre').forEach(pre => {
            pre.className = 'bg-black/40 border border-white/5 rounded-xl p-5 overflow-x-auto my-6 text-sm';
            const code = pre.querySelector('code');
            if (code) code.className = 'text-indigo-200 font-mono';
          });
          // Inline code
          wrapper.querySelectorAll('code:not(pre code)').forEach(code => {
            code.className = 'bg-black/40 text-indigo-300 px-1.5 py-0.5 rounded-md font-mono text-sm';
          });
          // Links
          wrapper.querySelectorAll('a').forEach(a => {
            a.className = 'text-indigo-400 hover:text-indigo-300 underline decoration-indigo-400/30 underline-offset-2 transition';
          });
          // Blockquotes
          wrapper.querySelectorAll('blockquote').forEach(bq => {
            bq.className = 'border-l-4 border-indigo-500/50 pl-4 italic text-slate-400 my-6';
          });
          // Images
          wrapper.querySelectorAll('img').forEach(img => {
            img.className = 'max-w-full rounded-xl my-4';
          });
          // Tables (if any)
          wrapper.querySelectorAll('table').forEach(table => {
            table.className = 'w-full border-collapse my-6 text-sm';
            table.querySelectorAll('th').forEach(th => th.className = 'border border-white/10 px-4 py-2 bg-white/5 text-left font-semibold');
            table.querySelectorAll('td').forEach(td => td.className = 'border border-white/10 px-4 py-2');
          });
          // Horizontal rules
          wrapper.querySelectorAll('hr').forEach(hr => {
            hr.className = 'border-white/10 my-8';
          });
        }, 300);
      } catch (error) {
        contentDiv.classList.remove('shimmer');
        contentDiv.innerHTML = `<div class="bg-red-900/20 border border-red-800/30 rounded-xl p-5 text-red-300 flex gap-3"><span>⚠️</span> Could not load <code class="bg-red-900/40 px-1.5 py-0.5 rounded">${path}</code>: ${error.message}</div>`;
      }
    }

    loadBtn.addEventListener('click', () => loadReadme(selectedValue));

    // Optional: auto-load the first file on page load
    // loadReadme('Documentation/readme.md');
  </script>
</body>
</html>
